services:
  judge0-server:
    image: judge0/judge0:latest
    env_file:
      - ./judge0.conf
    ports:
      - "2358:2358"
    privileged: true
    restart: unless-stopped
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-worker:
    image: judge0/judge0:latest
    command: ["./scripts/workers"]
    env_file:
      - ./judge0.conf
    privileged: true
    restart: unless-stopped
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
    volumes:
      - judge0-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  judge0-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - judge0-redis-data:/data
    restart: unless-stopped

  llama:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    profiles: ["llama"]
    volumes:
      - ./models:/models:ro
    ports:
      - "8080:8080"
    command:
      [
        "-m",
        "/models/${LLAMA_MODEL_FILE:-model.gguf}",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "-c",
        "${LLAMA_CTX_SIZE:-2048}",
        "-t",
        "${LLAMA_THREADS:-4}"
      ]
    restart: unless-stopped

volumes:
  judge0-db-data:
  judge0-redis-data:
