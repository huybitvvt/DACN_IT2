# Render Blueprint — deploy 1 web service (Express phục vụ cả API + frontend) + 1 PostgreSQL.
# Hướng dẫn dùng file này xem trong docs/DEPLOY.md.
services:
  - type: web
    name: codelearn
    runtime: node
    plan: free
    # Cài deps, build client + server, chạy migration + seed (idempotent)
    buildCommand: npm install && npm run build && npm run prisma:deploy --workspace server && npm run seed --workspace server
    startCommand: npm run start --workspace server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: codelearn-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render tự sinh chuỗi ngẫu nhiên
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        sync: false # điền URL của chính service sau khi có (vd https://codelearn.onrender.com)
      - key: GROQ_API_KEY
        sync: false # tự điền khoá Groq trong dashboard
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: ENABLE_SEMANTIC_RAG
        value: "false"
      - key: WANDBOX_URL
        value: https://wandbox.org

databases:
  - name: codelearn-db
    plan: free
